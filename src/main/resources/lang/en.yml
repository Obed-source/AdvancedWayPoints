# ============================================================
#  AdvancedWayPoints - English
#  Every text of the plugin: messages, help, chat list and menus.
#  Colors: &a, &l... and hex &#RRGGBB. {placeholders} are replaced automatically.
#  {cmd} is the configured main command (default "waypoints").
#  Set a message to "" to not send it.
# ============================================================

# Do not edit: used to update this file automatically.
config-version: 3

messages:
  no-permission: "&cYou don't have permission to do that."
  usage: "&cUsage: &f{usage}"
  loading: "&eYour waypoints are still loading, try again in a second."
  player-only: "&cOnly players can use this command."
  unknown-command: "&cUnknown command. Use &f/{command} help&c."
  player-not-found: "&cPlayer &f{player} &cwas not found."
  player-offline: "&cPlayer &f{player} &cis not online."
  not-found: "&cYou have no waypoint &f{input}&c."
  name-empty: "&cThe name can't be empty."
  name-too-long: "&cThe name can have at most &f{max} &ccharacters."
  name-invalid: "&cThe name can only have letters, numbers and spaces."
  limit-reached: "&cYou reached your limit of &f{limit} &cwaypoints."
  world-not-allowed: "&cYou can't create waypoints in this world."
  region-not-allowed: "&cYou can't create waypoints in this area."
  world-not-loaded: "&cWorld &f{world} &cis not loaded."
  cancelled: "&cThe action was cancelled."
  cost:
    not-enough: "&cYou need &f{price} &cto do that."
  created: "&aWaypoint {icon_color}{icon} {name} &acreated at &f{x}, {y}, {z}&a."
  created-paid: "&aWaypoint {icon_color}{icon} {name} &acreated for &f{price}&a."
  renamed: "&aThe waypoint is now called {name}&a."
  color-no-permission: "&cYou don't have permission to use the color &f{color}&c."
  color-no-permission-custom: "&cYou don't have permission to use custom colors."
  color-invalid: "&cInvalid color: &f{color}&c. Use a color from the list, &f#RRGGBB &cor a color code."
  color-changed:
    text: "&aText color of {name} &achanged to {color}&a."
    icon: "&aIcon color of {name} &achanged to {color}&a."
    background: "&aBackground of {name} &achanged to {color}&a."
  icon-invalid: "&cThat icon is not in the list."
  icon-changed: "&aIcon of {name} &achanged to {icon_color}{icon}&a."
  favorite-added: "&e★ {name} &eis now a favorite."
  favorite-removed: "&7{name} &7is no longer a favorite."
  deleted: "&cWaypoint {name} &cdeleted."
  share-self: "&cYou can't share a waypoint with yourself."
  share-target-limit: "&c{player} reached their waypoint limit."
  shared: "&a{player} accepted {name}&a."
  shared-paid: "&a{player} accepted {name}&a. You paid &f{price}&a."
  shown: "&aShowing {icon_color}{icon} {name}&a."
  shown-accumulate: "&aAlso showing {icon_color}{icon} {name}&a."
  hidden: "&7You hid {name}&7."
  not-visible: "&c{name} &cis not visible."
  nothing-visible: "&cYou have no visible waypoints."
  hidden-all: "&7You hid all your waypoints (they stay in your list)."
  mode-single: "&eView mode: &fone at a time&e. Picking a waypoint hides the previous one."
  mode-accumulate: "&eView mode: &faccumulate&e. Picked waypoints add up on screen."
  restarted: "&aConfiguration reloaded (data was not reloaded)."
  admin-cleared: "&cDeleted &f{count} &cwaypoints of &f{player}&c."
  admin-info:
    - "&8&m                                        "
    - "&b&lWaypoints of &f{player}"
    - "&7Waypoints: &f{count} &8/ &f{limit}"
    - "&7Visible: &f{visible}"
    - "&7View mode: &f{mode}"
    - "&7Online: &f{online}"
    - "&7UUID: &f{uuid}"
    - "&8&m                                        "
  teleported: "&aTeleported to {name}&a."
  teleported-paid: "&aTeleported to {name} &afor &f{price}&a."
  teleport-disabled: "&cTeleporting to waypoints is disabled."
  death-created: "&cYou died. &7A {icon_color}{icon} {name} &7waypoint marks the spot for &f{time_left}&7."
  death-created-permanent: "&cYou died. &7A {icon_color}{icon} {name} &7waypoint marks the spot."
  death-expired: "&7Your {icon_color}{icon} {name} &7waypoint disappeared."
  death-not-editable: "&cDeath waypoints can't be changed."
  share-disabled: "&cSharing waypoints is disabled."
  share-death-disabled: "&cDeath waypoints can't be shared."
  share-request-sent: "&aRequest sent to &f{player}&a. They have &f{seconds}s &ato accept {name}&a."
  share-target-loading: "&c{player} is still loading, try again in a second."
  share-request-not-found: "&cThat share request no longer exists."
  share-sender-offline: "&c{player} is no longer online."
  share-waypoint-gone: "&cThat waypoint no longer exists."
  share-failed-cost: "&c{player} accepted {name}&c, but you couldn't pay &f{price}&c."
  share-sender-cannot-pay: "&c{player} can't pay for the share right now."
  share-accepted: "&aYou accepted {icon_color}{icon} {name} &afrom &f{player}&a. It is now visible."
  share-declined: "&7You declined the waypoint from &f{player}&7."
  share-declined-sender: "&c{player} declined your waypoint."
  share-expired-sender: "&7{player} did not answer your share request."
  share-expired-receiver: "&7The share request from {player} expired."
  update-available: "&eA new version of AdvancedWayPoints is available: &f{version}&e. {changelog}"
  update-downloaded: "&aVersion &f{version} &awas downloaded and will be installed on the next restart."

input:
  anvil-title:
    rename: "New name"
    share: "Player name"
    create: "Waypoint name"
  # Two lines shown on the sign, below what the player writes.
  sign-lines:
    rename:
      - "^^^^^^^^^^"
      - "New name"
    share:
      - "^^^^^^^^^^"
      - "Player"
    create:
      - "^^^^^^^^^^"
      - "Name"
  chat-prompt:
    rename: "&eType the new name in chat. Type &f{cancel} &eto cancel &7({seconds}s)."
    share: "&eType the player's name in chat. Type &f{cancel} &eto cancel &7({seconds}s)."
    create: "&eType the waypoint name in chat. Type &f{cancel} &eto cancel &7({seconds}s)."
  command-prompt:
    rename: "&e[Click here] &7to type the new name."
    share: "&e[Click here] &7to type the player's name."
    create: "&e[Click here] &7to type the waypoint name."
  command-hover:
    - "&7Type the value and press &fEnter&7."
  timeout: "&cTime to type ran out."

help:
  header:
    - "&8&m          &r &b&lWaypoints &7- Help &8(&f{page}&8/&f{pages}&8) &8&m          "
  admin-header:
    - "&8&m       &r &c&lWaypoints &7- Admin help &8(&f{page}&8/&f{pages}&8) &8&m       "
  line: " &b{usage} &8- &7{description}"
  admin-line: " &c{usage} &8- &7{description}"
  hover:
    - "&7Click to write the command"
  entries:
    help: {usage: "help [page]", description: "Shows this help."}
    menu: {usage: "menu", description: "Opens your waypoint menu."}
    create: {usage: "create <name>", description: "Creates a waypoint where you stand."}
    list: {usage: "list [page]", description: "Lists your waypoints. Click one to see it."}
    view: {usage: "view <id>", description: "Shows or hides a waypoint."}
    hide: {usage: "hide <id>", description: "Hides a waypoint from view (it stays in the list)."}
    hide-all: {usage: "hide all", description: "Hides all your waypoints from view."}
    mode: {usage: "mode", description: "Switches between one at a time and accumulate."}
    rename: {usage: "rename <id> <name>", description: "Renames a waypoint."}
    color: {usage: "color <id> <text|icon|background> <color>", description: "Changes a color of a waypoint."}
    favorite: {usage: "favorite <id>", description: "Marks or unmarks a waypoint as favorite."}
    share: {usage: "share <id> <player>", description: "Offers a copy of the waypoint to an online player."}
    delete: {usage: "delete <id>", description: "Deletes a waypoint."}
    teleport: {usage: "tp <id>", description: "Teleports you to one of your waypoints."}
    admin-help: {usage: "admin help [page]", description: "Shows every command (user and admin)."}
    admin-list: {usage: "admin list <player> [page]", description: "Lists a player's waypoints."}
    admin-menu: {usage: "admin menu <player>", description: "Edits a player's waypoints from the menu."}
    admin-info: {usage: "admin info <player>", description: "Waypoint data of a player."}
    admin-tp: {usage: "admin tp <player> <id>", description: "Teleports you to a player's waypoint."}
    admin-create: {usage: "admin create <player> <name>", description: "Creates a waypoint for a player where you stand."}
    admin-rename: {usage: "admin rename <player> <id> <name>", description: "Renames a player's waypoint."}
    admin-color: {usage: "admin color <player> <id> <text|icon|background> <color>", description: "Changes a color of a player's waypoint."}
    admin-delete: {usage: "admin delete <player> <id>", description: "Deletes a player's waypoint."}
    admin-clear: {usage: "admin clear <player>", description: "Deletes every waypoint of a player."}
    restart: {usage: "restart", description: "Reloads the configuration (not the database)."}

share-request:
  received: "&b{player} &awants to share {icon_color}{icon} {name} &awith you &7({seconds}s)."
  accept: "&a&l[ACCEPT]"
  separator: " "
  decline: "&c&l[DECLINE]"
  accept-hover:
    - "&7Add {name} &7to your waypoints"
  decline-hover:
    - "&7Reject the waypoint"

teleport:
  # Shown when a countdown starts, by cancel mode (teleport.countdown.cancel-on).
  countdown-start:
    none: "&eTeleporting to {name} &ein &f{seconds}s&e."
    damage: "&eTeleporting to {name} &ein &f{seconds}s&e. Taking damage cancels it."
    movement: "&eTeleporting to {name} &ein &f{seconds}s&e. Don't move."
  countdown: "&eTeleporting in &f{seconds}&e..."
  cancelled-damage: "&cTeleport cancelled: you took damage."
  cancelled-movement: "&cTeleport cancelled: you moved."

death:
  # Name of death waypoints (players can rename them).
  name: "Death"

pages:
  previous: "&b&l« Previous "
  previous-disabled: "&8« Previous "
  next: " &b&lNext »"
  next-disabled: " &8Next »"
  current: "&7[&f{page}&7/&f{pages}&7]"
  previous-hover:
    - "&7Go to the previous page"
  next-hover:
    - "&7Go to the next page"

list:
  header:
    - "&8&m        &r &b&lYour waypoints &8(&f{count}&8/&f{limit}&8) &7Mode: &f{mode} &8&m        "
  admin-header:
    - "&8&m        &r &c&lWaypoints of {owner} &8(&f{count}&8) &8&m        "
  empty:
    - " &7No waypoints yet. Create one with &f/{cmd} create <name>&7."
  # Placeholders: {visible} {favorite} {icon_color} {icon} {name} {x} {y} {z} {world} {distance} {created}
  entry: " {visible} {favorite}{icon_color}{icon} {name} &8» &7{x}, {y}, {z} &8(&7{world}&8)"
  hover:
    - "{icon_color}{icon} {name}"
    - "&7World: &f{world}"
    - "&7Coordinates: &f{x}, {y}, {z}"
    - "&7Distance: &f{distance}"
    - "&7Created: &f{created}"
    - ""
    - "&eClick &7to show or hide"
    - "&eShift + click &7to write its ID in chat"
  admin-hover:
    - "{icon_color}{icon} {name}"
    - "&7World: &f{world}"
    - "&7Coordinates: &f{x}, {y}, {z}"
    - "&7Created: &f{created}"
    - "&7ID: &f{code}"
    - ""
    - "&eClick &7to edit it"
  hover-id:
    - "&7ID: &f{code}"
  visible-marker: "&a●"
  hidden-marker: "&8○"
  favorite-marker: "&e★ "
  other-world: "other world"

placeholders:
  mode-single: "one at a time"
  mode-accumulate: "accumulate"
  none: "none"
  answer-yes: "yes"
  answer-no: "no"
  other-world: "other world"
  free: "free"
  never: "never"
  type-normal: "waypoint"
  type-death: "death"

colors:
  white: "&fWhite"
  light_gray: "&7Light gray"
  gray: "&8Gray"
  black: "&0Black"
  brown: "&#8B5A2BBrown"
  red: "&cRed"
  orange: "&6Orange"
  yellow: "&eYellow"
  lime: "&aLime"
  green: "&2Green"
  cyan: "&3Cyan"
  light_blue: "&bLight blue"
  blue: "&9Blue"
  purple: "&5Purple"
  magenta: "&dMagenta"
  pink: "&#FFB6C1Pink"

menu:
  # Added to the lore of buttons without permission (when menus.hide-items-without-permission is false).
  no-permission-lore:
    - ""
    - "&c✖ You don't have permission for this"
  main:
    title: "&8Your waypoints &7({page}/{pages})"
    admin-title: "&4Waypoints of {owner} &7({page}/{pages})"
    waypoint:
      name: "{icon_color}{icon} {name}"
      # Every line is free text. Available: {name} {name_plain} {icon} {icon_color} {text_color} {world} {x} {y} {z}
      # {distance} {created} {status} {code} {time_left} {favorite} {death} {left_click} {teleport}
      # {teleport_price} {share_price} {create_price} ("free" when it costs nothing for this player).
      lines:
        - "{favorite}"
        - "{death}"
        - "&7World: &f{world}"
        - "&7Coordinates: &f{x}, {y}, {z}"
        - "&7Distance: &f{distance}"
        - "&7Created: &f{created}"
        - "&7Status: {status}"
        - ""
        - "{left_click}"
        - "&eRight click &7to edit"
        - "{teleport}"
      admin-lines:
        - "{favorite}"
        - "{death}"
        - "&7World: &f{world}"
        - "&7Coordinates: &f{x}, {y}, {z}"
        - "&7Created: &f{created}"
        - "&7ID: &f{code}"
        - ""
        - "&eClick &7to edit"
        - "{teleport}"
      left-click-show: "&eLeft click &7to show"
      left-click-hide: "&eLeft click &7to hide"
      teleport: "&eShift + left click &7to teleport"
      teleport-paid: "&eShift + left click &7to teleport &8(&f{price}&8)"
      death: "&c☠ Death point"
      death-expires: "&c☠ Death point &7- disappears in &f{time_left}"
      visible: "&aVisible"
      hidden: "&7Hidden"
      favorite: "&e★ Favorite"
      other-world: "other world"
    items:
      filler: {name: " "}
      empty:
        name: "&7You have no waypoints yet"
        lore:
          - "&7Create one with the book below"
          - "&7or with &f/{cmd} create <name>"
      info:
        name: "&b&lWaypoints of {owner}"
        lore:
          - "&7Waypoints: &f{count}"
          - "&7Visible: &f{visible}"
      view-mode-single:
        name: "&eView: &fone at a time"
        lore:
          - "&7Picking a waypoint hides"
          - "&7the one that was visible."
          - ""
          - "&eClick &7to switch to &faccumulate"
      view-mode-accumulate:
        name: "&eView: &faccumulate"
        lore:
          - "&7Picked waypoints add up"
          - "&7to the visible ones."
          - ""
          - "&eClick &7to switch to &fone at a time"
      hide-all:
        name: "&cHide all"
        lore:
          - "&7Removes every waypoint from view."
          - "&7They stay in your list."
      previous-page: {name: "&b« Previous page", lore: ["&7Page {page} of {pages}"]}
      previous-page-disabled: {name: "&8« Previous page"}
      page-info: {name: "&fPage {page}/{pages}"}
      next-page: {name: "&bNext page »", lore: ["&7Page {page} of {pages}"]}
      next-page-disabled: {name: "&8Next page »"}
      create:
        name: "&aCreate waypoint here"
        lore:
          - "&7Saves your current position"
          - "&7with the name you type."
      close: {name: "&cClose"}
  edit:
    title: "&8Edit: {name_plain}"
    items:
      filler: {name: " "}
      preview:
        name: "{icon_color}{icon} {name}"
        lore:
          - "&7World: &f{world}"
          - "&7Coordinates: &f{x}, {y}, {z}"
          - "&7Created: &f{created}"
      rename:
        name: "&eRename"
        lore:
          - "&7Current: {name}"
          - ""
          - "&eClick &7to type a new one"
      text-color:
        name: "&eText color"
        lore:
          - "&7Current: {text_color_name}"
      icon:
        name: "&eIcon: {icon_color}{icon}"
        lore:
          - "&7The symbol shown before the name."
          - ""
          - "&eClick &7to pick another"
      icon-color:
        name: "&eIcon color"
        lore:
          - "&7Current: {icon_color_name}"
      background-color:
        name: "&eBackground color"
        lore:
          - "&7Current: {background_name}"
      favorite-add:
        name: "&e★ Add to favorites"
        lore:
          - "&7Favorites come first in the list."
      favorite-remove:
        name: "&7☆ Remove from favorites"
        lore:
          - "&7It goes back to date order."
      share:
        name: "&bShare"
        lore:
          - "&7Sends a copy to another player."
          - "&7They must be online and accept it."
      share-paid:
        name: "&bShare"
        lore:
          - "&7Sends a copy to another player."
          - "&7They must be online and accept it."
          - "&7Price: &f{share_price}"
      death-locked:
        name: "&c☠ Death point"
        lore:
          - "&7Its name, colors and icon can't be changed."
          - "&7Disappears in: &f{time_left}"
      teleport:
        name: "&dTeleport"
        lore:
          - "&7Takes you to this waypoint."
      teleport-paid:
        name: "&dTeleport"
        lore:
          - "&7Takes you to this waypoint."
          - "&7Price: &f{price}"
      back: {name: "&7« Back"}
      delete:
        name: "&cDelete"
        lore:
          - "&7You will be asked to confirm."
  color:
    title:
      text: "&8Text color"
      icon: "&8Icon color"
      background: "&8Background color"
    color-item:
      name: "{color}"
      lore:
        - "&7Code: &f{hex}"
      selected:
        - ""
        - "&a✔ Selected"
      click:
        - ""
        - "&eClick &7to apply"
      locked:
        - ""
        - "&c✖ You don't have permission for this color"
    items:
      filler: {name: " "}
      back: {name: "&7« Back"}
      previous-page: {name: "&b« Previous page"}
      previous-page-disabled: {name: "&8« Previous page"}
      page-info: {name: "&fPage {page}/{pages}"}
      next-page: {name: "&bNext page »"}
      next-page-disabled: {name: "&8Next page »"}
  icon:
    title: "&8Pick an icon"
    icon-item:
      name: "&f{new_icon}"
      lore:
        - "&7It will look like:"
        - "{icon_color}{new_icon} {name}"
      selected:
        - ""
        - "&a✔ Current icon"
      click:
        - ""
        - "&eClick &7to use it"
    items:
      filler: {name: " "}
      back: {name: "&7« Back"}
      previous-page: {name: "&b« Previous page"}
      previous-page-disabled: {name: "&8« Previous page"}
      page-info: {name: "&fPage {page}/{pages}"}
      next-page: {name: "&bNext page »"}
      next-page-disabled: {name: "&8Next page »"}
  confirm-delete:
    title: "&4Delete this waypoint?"
    items:
      filler: {name: " "}
      confirm:
        name: "&a✔ Yes, delete"
        lore:
          - "&7This can't be undone."
      preview:
        name: "{icon_color}{icon} {name}"
        lore:
          - "&7{world} &8- &7{x}, {y}, {z}"
      cancel: {name: "&c✖ No, go back"}

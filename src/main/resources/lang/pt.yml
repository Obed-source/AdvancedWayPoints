# ============================================================
#  AdvancedWayPoints - Português
#  Todos os textos do plugin: mensagens, ajuda, lista do chat e menus.
#  Cores: &a, &l... e hex &#RRGGBB. Os {placeholders} são substituídos automaticamente.
#  {cmd} é o comando principal configurado (padrão "waypoints").
#  Deixe uma mensagem como "" para não enviá-la.
# ============================================================


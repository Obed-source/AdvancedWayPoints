input:
  anvil-title:
    rename: "Novo nome"
    share: "Nome do jogador"
    create: "Nome do waypoint"
  # Duas linhas mostradas na placa, abaixo do que o jogador escreve.
  sign-lines:
    rename:
      - "^^^^^^^^^^"
      - "Novo nome"
    share:
      - "^^^^^^^^^^"
      - "Jogador"
    create:
      - "^^^^^^^^^^"
      - "Nome"
  chat-prompt:
    rename: "&eEscreva o novo nome no chat. Escreva &f{cancel} &epara cancelar &7({seconds}s)."
    share: "&eEscreva o nome do jogador no chat. Escreva &f{cancel} &epara cancelar &7({seconds}s)."
    create: "&eEscreva o nome do waypoint no chat. Escreva &f{cancel} &epara cancelar &7({seconds}s)."
  command-prompt:
    rename: "&e[Clique aqui] &7para escrever o novo nome."
    share: "&e[Clique aqui] &7para escrever o nome do jogador."
    create: "&e[Clique aqui] &7para escrever o nome do waypoint."
  command-hover:
    - "&7Escreva o valor e aperte &fEnter&7."
  timeout: "&cO tempo para escrever acabou."

help:
  header:
    - "&8&m          &r &b&lWaypoints &7- Ajuda &8(&f{page}&8/&f{pages}&8) &8&m          "
  admin-header:
    - "&8&m       &r &c&lWaypoints &7- Ajuda de admin &8(&f{page}&8/&f{pages}&8) &8&m       "
  line: " &b{usage} &8- &7{description}"
  admin-line: " &c{usage} &8- &7{description}"
  hover:
    - "&7Clique para escrever o comando"
  entries:
    help: {usage: "help [página]", description: "Mostra esta ajuda."}
    menu: {usage: "menu", description: "Abre seu menu de waypoints."}
    create: {usage: "create <nome>", description: "Cria um waypoint onde você está."}
    list: {usage: "list [página]", description: "Lista seus waypoints. Clique em um para vê-lo."}
    view: {usage: "view <id>", description: "Mostra ou oculta um waypoint."}
    hide: {usage: "hide <id>", description: "Oculta um waypoint (ele continua na lista)."}
    hide-all: {usage: "hide all", description: "Oculta todos os seus waypoints."}
    mode: {usage: "mode", description: "Alterna entre um por vez e acumular."}
    rename: {usage: "rename <id> <nome>", description: "Renomeia um waypoint."}
    color: {usage: "color <id> <text|icon|background> <cor>", description: "Muda uma cor de um waypoint."}
    favorite: {usage: "favorite <id>", description: "Marca ou desmarca um waypoint como favorito."}
    share: {usage: "share <id> <jogador>", description: "Oferece uma cópia do waypoint a um jogador online."}
    delete: {usage: "delete <id>", description: "Exclui um waypoint."}
    teleport: {usage: "tp <id>", description: "Teleporta você para um dos seus waypoints."}
    admin-help: {usage: "admin help [página]", description: "Mostra todos os comandos (jogador e admin)."}
    admin-list: {usage: "admin list <jogador> [página]", description: "Lista os waypoints de um jogador."}
    admin-menu: {usage: "admin menu <jogador>", description: "Edita os waypoints de um jogador pelo menu."}
    admin-info: {usage: "admin info <jogador>", description: "Dados dos waypoints de um jogador."}
    admin-tp: {usage: "admin tp <jogador> <id>", description: "Teleporta você para o waypoint de um jogador."}
    admin-create: {usage: "admin create <jogador> <nome>", description: "Cria um waypoint para um jogador onde você está."}
    admin-rename: {usage: "admin rename <jogador> <id> <nome>", description: "Renomeia o waypoint de um jogador."}
    admin-color: {usage: "admin color <jogador> <id> <text|icon|background> <cor>", description: "Muda uma cor do waypoint de um jogador."}
    admin-delete: {usage: "admin delete <jogador> <id>", description: "Exclui o waypoint de um jogador."}
    admin-clear: {usage: "admin clear <jogador>", description: "Exclui todos os waypoints de um jogador."}
    restart: {usage: "restart", description: "Recarrega a configuração (não o banco de dados)."}


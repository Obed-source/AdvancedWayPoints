input:
  anvil-title:
    rename: "Neuer Name"
    share: "Spielername"
    create: "Wegpunktname"
  # Zwei Zeilen auf dem Schild, unter dem, was der Spieler schreibt.
  sign-lines:
    rename:
      - "^^^^^^^^^^"
      - "Neuer Name"
    share:
      - "^^^^^^^^^^"
      - "Spieler"
    create:
      - "^^^^^^^^^^"
      - "Name"
  chat-prompt:
    rename: "&eSchreibe den neuen Namen in den Chat. Schreibe &f{cancel}&e, um abzubrechen &7({seconds}s)."
    share: "&eSchreibe den Spielernamen in den Chat. Schreibe &f{cancel}&e, um abzubrechen &7({seconds}s)."
    create: "&eSchreibe den Wegpunktnamen in den Chat. Schreibe &f{cancel}&e, um abzubrechen &7({seconds}s)."
  command-prompt:
    rename: "&e[Hier klicken]&7, um den neuen Namen zu schreiben."
    share: "&e[Hier klicken]&7, um den Spielernamen zu schreiben."
    create: "&e[Hier klicken]&7, um den Wegpunktnamen zu schreiben."
  command-hover:
    - "&7Schreibe den Wert und drücke &fEnter&7."
  timeout: "&cDie Zeit zum Schreiben ist abgelaufen."

help:
  header:
    - "&8&m          &r &b&lWegpunkte &7- Hilfe &8(&f{page}&8/&f{pages}&8) &8&m          "
  admin-header:
    - "&8&m       &r &c&lWegpunkte &7- Admin-Hilfe &8(&f{page}&8/&f{pages}&8) &8&m       "
  line: " &b{usage} &8- &7{description}"
  admin-line: " &c{usage} &8- &7{description}"
  hover:
    - "&7Klicken, um den Befehl zu schreiben"
  entries:
    help: {usage: "help [seite]", description: "Zeigt diese Hilfe."}
    menu: {usage: "menu", description: "Öffnet dein Wegpunkt-Menü."}
    create: {usage: "create <name>", description: "Erstellt einen Wegpunkt an deiner Position."}
    list: {usage: "list [seite]", description: "Listet deine Wegpunkte. Klicke einen an, um ihn zu sehen."}
    view: {usage: "view <id>", description: "Zeigt einen Wegpunkt an oder blendet ihn aus."}
    hide: {usage: "hide <id>", description: "Blendet einen Wegpunkt aus (er bleibt in der Liste)."}
    hide-all: {usage: "hide all", description: "Blendet alle deine Wegpunkte aus."}
    mode: {usage: "mode", description: "Wechselt zwischen einzeln und sammeln."}
    rename: {usage: "rename <id> <name>", description: "Benennt einen Wegpunkt um."}
    color: {usage: "color <id> <text|icon|background> <farbe>", description: "Ändert eine Farbe eines Wegpunkts."}
    favorite: {usage: "favorite <id>", description: "Markiert einen Wegpunkt als Favorit oder entfernt die Markierung."}
    share: {usage: "share <id> <spieler>", description: "Bietet einem Online-Spieler eine Kopie des Wegpunkts an."}
    delete: {usage: "delete <id>", description: "Löscht einen Wegpunkt."}
    teleport: {usage: "tp <id>", description: "Teleportiert dich zu einem deiner Wegpunkte."}
    admin-help: {usage: "admin help [seite]", description: "Zeigt alle Befehle (Spieler und Admin)."}
    admin-list: {usage: "admin list <spieler> [seite]", description: "Listet die Wegpunkte eines Spielers."}
    admin-menu: {usage: "admin menu <spieler>", description: "Bearbeitet die Wegpunkte eines Spielers im Menü."}
    admin-info: {usage: "admin info <spieler>", description: "Wegpunkt-Daten eines Spielers."}
    admin-tp: {usage: "admin tp <spieler> <id>", description: "Teleportiert dich zum Wegpunkt eines Spielers."}
    admin-create: {usage: "admin create <spieler> <name>", description: "Erstellt an deiner Position einen Wegpunkt für einen Spieler."}
    admin-rename: {usage: "admin rename <spieler> <id> <name>", description: "Benennt den Wegpunkt eines Spielers um."}
    admin-color: {usage: "admin color <spieler> <id> <text|icon|background> <farbe>", description: "Ändert eine Farbe des Wegpunkts eines Spielers."}
    admin-delete: {usage: "admin delete <spieler> <id>", description: "Löscht den Wegpunkt eines Spielers."}
    admin-clear: {usage: "admin clear <spieler>", description: "Löscht alle Wegpunkte eines Spielers."}
    restart: {usage: "restart", description: "Lädt die Konfiguration neu (nicht die Datenbank)."}


input:
  anvil-title:
    rename: "Nuevo nombre"
    share: "Nombre del jugador"
    create: "Nombre del waypoint"
  # Dos líneas que se ven en el cartel, debajo de lo que escribe el jugador.
  sign-lines:
    rename:
      - "^^^^^^^^^^"
      - "Nuevo nombre"
    share:
      - "^^^^^^^^^^"
      - "Jugador"
    create:
      - "^^^^^^^^^^"
      - "Nombre"
  chat-prompt:
    rename: "&eEscribe el nuevo nombre en el chat. Escribe &f{cancel} &epara cancelar &7({seconds}s)."
    share: "&eEscribe el nombre del jugador en el chat. Escribe &f{cancel} &epara cancelar &7({seconds}s)."
    create: "&eEscribe el nombre del waypoint en el chat. Escribe &f{cancel} &epara cancelar &7({seconds}s)."
  command-prompt:
    rename: "&e[Clic aquí] &7para escribir el nuevo nombre."
    share: "&e[Clic aquí] &7para escribir el nombre del jugador."
    create: "&e[Clic aquí] &7para escribir el nombre del waypoint."
  command-hover:
    - "&7Escribe el valor y pulsa &fEnter&7."
  timeout: "&cSe acabó el tiempo para escribir."

help:
  header:
    - "&8&m          &r &b&lWaypoints &7- Ayuda &8(&f{page}&8/&f{pages}&8) &8&m          "
  admin-header:
    - "&8&m       &r &c&lWaypoints &7- Ayuda admin &8(&f{page}&8/&f{pages}&8) &8&m       "
  line: " &b{usage} &8- &7{description}"
  admin-line: " &c{usage} &8- &7{description}"
  hover:
    - "&7Clic para escribir el comando"
  entries:
    help: {usage: "help [página]", description: "Muestra esta ayuda."}
    menu: {usage: "menu", description: "Abre el menú de tus waypoints."}
    create: {usage: "create <nombre>", description: "Crea un waypoint donde estás parado."}
    list: {usage: "list [página]", description: "Lista tus waypoints. Clic en uno para verlo."}
    view: {usage: "view <id>", description: "Muestra u oculta un waypoint."}
    hide: {usage: "hide <id>", description: "Oculta un waypoint de la vista (sigue en la lista)."}
    hide-all: {usage: "hide all", description: "Oculta todos tus waypoints de la vista."}
    mode: {usage: "mode", description: "Cambia entre ver uno a la vez o acumular."}
    rename: {usage: "rename <id> <nombre>", description: "Cambia el nombre de un waypoint."}
    color: {usage: "color <id> <text|icon|background> <color>", description: "Cambia un color de un waypoint."}
    favorite: {usage: "favorite <id>", description: "Marca o desmarca un waypoint como favorito."}
    share: {usage: "share <id> <jugador>", description: "Ofrece una copia del waypoint a un jugador conectado."}
    delete: {usage: "delete <id>", description: "Elimina un waypoint."}
    teleport: {usage: "tp <id>", description: "Te teletransporta a uno de tus waypoints."}
    admin-help: {usage: "admin help [página]", description: "Muestra todos los comandos (usuario y admin)."}
    admin-list: {usage: "admin list <jugador> [página]", description: "Lista los waypoints de un jugador."}
    admin-menu: {usage: "admin menu <jugador>", description: "Edita los waypoints de un jugador desde el menú."}
    admin-info: {usage: "admin info <jugador>", description: "Datos de waypoints de un jugador."}
    admin-tp: {usage: "admin tp <jugador> <id>", description: "Te teletransporta a un waypoint de un jugador."}
    admin-create: {usage: "admin create <jugador> <nombre>", description: "Crea un waypoint para un jugador donde estás."}
    admin-rename: {usage: "admin rename <jugador> <id> <nombre>", description: "Renombra el waypoint de un jugador."}
    admin-color: {usage: "admin color <jugador> <id> <text|icon|background> <color>", description: "Cambia un color del waypoint de un jugador."}
    admin-delete: {usage: "admin delete <jugador> <id>", description: "Elimina el waypoint de un jugador."}
    admin-clear: {usage: "admin clear <jugador>", description: "Elimina todos los waypoints de un jugador."}
    restart: {usage: "restart", description: "Recarga la configuración (no la base de datos)."}

share-request:
  received: "&b{player} &aquiere compartirte {icon_color}{icon} {name} &7({seconds}s)."

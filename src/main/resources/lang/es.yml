# ============================================================
#  AdvancedWayPoints - Español
#  Todos los textos del plugin: mensajes, ayuda, lista del chat y menús.
#  Colores: &a, &l... y hexadecimal &#RRGGBB. Los {marcadores} se reemplazan solos.
#  {cmd} es el comando principal configurado (por defecto "waypoints").
#  Deja un mensaje en "" para no enviarlo.
# ============================================================

# No editar: se usa para actualizar este archivo automáticamente.
config-version: 3


  cancelled-damage: "&cTeletransporte cancelado: recibiste daño."
  cancelled-movement: "&cTeletransporte cancelado: te moviste."
  # Cuando el jugador pide otro teletransporte (al mismo waypoint o a otro) durante la cuenta regresiva.
  cancelled-request: "&cTeletransporte a {name} &ccancelado."


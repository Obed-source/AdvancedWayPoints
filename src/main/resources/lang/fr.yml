# ============================================================
#  AdvancedWayPoints - Français
#  Tous les textes du plugin : messages, aide, liste du chat et menus.
#  Couleurs : &a, &l... et hex &#RRGGBB. Les {placeholders} sont remplacés automatiquement.
#  {cmd} est la commande principale configurée (par défaut "waypoints").
#  Mettez un message à "" pour ne pas l'envoyer.
# ============================================================

# Ne pas modifier : sert à mettre à jour ce fichier automatiquement.

input:
  anvil-title:
    rename: "Nouveau nom"
    share: "Nom du joueur"
    create: "Nom du waypoint"
  # Deux lignes affichées sur le panneau, sous ce que le joueur écrit.
  sign-lines:
    rename:
      - "^^^^^^^^^^"
      - "Nouveau nom"
    share:
      - "^^^^^^^^^^"
      - "Joueur"
    create:
      - "^^^^^^^^^^"
      - "Nom"
  chat-prompt:
    rename: "&eÉcrivez le nouveau nom dans le chat. Écrivez &f{cancel} &epour annuler &7({seconds}s)."
    share: "&eÉcrivez le nom du joueur dans le chat. Écrivez &f{cancel} &epour annuler &7({seconds}s)."
    create: "&eÉcrivez le nom du waypoint dans le chat. Écrivez &f{cancel} &epour annuler &7({seconds}s)."
  command-prompt:
    rename: "&e[Cliquez ici] &7pour écrire le nouveau nom."
    share: "&e[Cliquez ici] &7pour écrire le nom du joueur."
    create: "&e[Cliquez ici] &7pour écrire le nom du waypoint."
  command-hover:
    - "&7Écrivez la valeur et appuyez sur &fEntrée&7."
  timeout: "&cLe temps pour écrire est écoulé."

help:
  header:
    - "&8&m          &r &b&lWaypoints &7- Aide &8(&f{page}&8/&f{pages}&8) &8&m          "
  admin-header:
    - "&8&m       &r &c&lWaypoints &7- Aide admin &8(&f{page}&8/&f{pages}&8) &8&m       "
  line: " &b{usage} &8- &7{description}"
  admin-line: " &c{usage} &8- &7{description}"
  hover:
    - "&7Cliquez pour écrire la commande"
  entries:
    help: {usage: "help [page]", description: "Affiche cette aide."}
    menu: {usage: "menu", description: "Ouvre votre menu de waypoints."}
    create: {usage: "create <nom>", description: "Crée un waypoint là où vous êtes."}
    list: {usage: "list [page]", description: "Liste vos waypoints. Cliquez sur l'un d'eux pour le voir."}
    view: {usage: "view <id>", description: "Affiche ou masque un waypoint."}
    hide: {usage: "hide <id>", description: "Masque un waypoint (il reste dans la liste)."}
    hide-all: {usage: "hide all", description: "Masque tous vos waypoints."}
    mode: {usage: "mode", description: "Alterne entre un à la fois et cumulé."}
    rename: {usage: "rename <id> <nom>", description: "Renomme un waypoint."}
    color: {usage: "color <id> <text|icon|background> <couleur>", description: "Change une couleur d'un waypoint."}
    favorite: {usage: "favorite <id>", description: "Marque ou retire un waypoint des favoris."}
    share: {usage: "share <id> <joueur>", description: "Propose une copie du waypoint à un joueur en ligne."}
    delete: {usage: "delete <id>", description: "Supprime un waypoint."}
    teleport: {usage: "tp <id>", description: "Vous téléporte à l'un de vos waypoints."}
    admin-help: {usage: "admin help [page]", description: "Affiche toutes les commandes (joueur et admin)."}
    admin-list: {usage: "admin list <joueur> [page]", description: "Liste les waypoints d'un joueur."}
    admin-menu: {usage: "admin menu <joueur>", description: "Modifie les waypoints d'un joueur depuis le menu."}
    admin-info: {usage: "admin info <joueur>", description: "Données des waypoints d'un joueur."}
    admin-tp: {usage: "admin tp <joueur> <id>", description: "Vous téléporte au waypoint d'un joueur."}
    admin-create: {usage: "admin create <joueur> <nom>", description: "Crée un waypoint pour un joueur là où vous êtes."}
    admin-rename: {usage: "admin rename <joueur> <id> <nom>", description: "Renomme le waypoint d'un joueur."}
    admin-color: {usage: "admin color <joueur> <id> <text|icon|background> <couleur>", description: "Change une couleur du waypoint d'un joueur."}
    admin-delete: {usage: "admin delete <joueur> <id>", description: "Supprime le waypoint d'un joueur."}
    admin-clear: {usage: "admin clear <joueur>", description: "Supprime tous les waypoints d'un joueur."}
    restart: {usage: "restart", description: "Recharge la configuration (pas la base de données)."}

